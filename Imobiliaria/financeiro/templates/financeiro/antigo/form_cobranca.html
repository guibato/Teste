{% extends 'base.html' %}
{% block page_title %}Cadastro de Cobrança{% endblock %}
{% block content %}
<form method="post" class="bg-gray-800 p-6 rounded-lg shadow-lg max-w-2xl">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="mt-4">
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Salvar</button>
        <a href="{% url 'listar_cobrancas' %}" class="ml-4 text-gray-400 hover:text-white">Cancelar</a>
    </div>
</form>
{% endblock %}
