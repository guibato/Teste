{% extends 'base/base.html' %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<h2 class="text-xl font-bold mb-4">{{ titulo }}</h2>
<p class="mb-4">Tem certeza que deseja excluir: <strong>{{ objeto }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded mr-2">Sim, excluir</button>
    <a href="{% url 'listar_despesas' %}" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded">Cancelar</a>
</form>
{% endblock %}
