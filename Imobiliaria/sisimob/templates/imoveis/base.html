<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Imobiliário</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
    <!-- Navbar -->
    <nav class="bg-gray-800 shadow-lg">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Logo -->
            <a href="{% url 'home' %}" class="text-xl font-bold text-white hover:text-gray-300 transition">
                🏠 Palestra Imóveis
            </a>

            <!-- Menu de Navegação -->
            <div class="hidden md:flex gap-4">
                <a href="{% url 'cadastro_cliente' %}" class="hover:text-gray-300">Clientes</a>
                <a href="{% url 'cadastro_imovel' %}" class="hover:text-gray-300">Imóveis</a>
                <a href="{% url 'cadastro_contrato' %}" class="hover:text-gray-300">Contratos</a>
                <a href="{% url 'cadastro_cobrancas' %}" class="hover:text-gray-300">Cobranças</a>
                <a href="{% url 'extrato' %}" class="hover:text-gray-300">Extrato</a>
                <a href="{% url 'listar_reajustes' %}" class="hover:text-gray-300">Reajustes</a>
            </div>

            <!-- Logout -->
            <a href="{% url 'logout' %}" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-500 transition">
                Sair
            </a>
        </div>
    </nav>

    <!-- Mensagens de Feedback -->
    {% if messages %}
    <div class="container mx-auto p-4">
        {% for message in messages %}
        <div class="bg-green-600 text-white px-4 py-2 rounded-md mb-4 shadow-md">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Conteúdo -->
    <div class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </div>

    {% load static %}
    <script src="{% static 'js/bundle.js' %}"></script>
</body>
</html>
