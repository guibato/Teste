<form method="post" class="space-y-4">
    {% csrf_token %}
    <h2 class="text-xl font-bold mb-4">Atualizar Datas da Cobrança</h2>

    <!-- Data de Pagamento -->
    <div>
        <label for="data_pagamento" class="block text-sm font-medium text-gray-700">Data de Pagamento:</label>
        <input
            type="date"
            name="data_pagamento"
            id="data_pagamento"
            value="{{ cobranca.data_pagamento|date:'Y-m-d' }}"
            class="mt-1 block w-full p-2 border border-gray-300 rounded-md"
        />
    </div>

    <!-- Data de Repasse -->
    <div>
        <label for="data_repasse" class="block text-sm font-medium text-gray-700">Data de Repasse:</label>
        <input
            type="date"
            name="data_repasse"
            id="data_repasse"
            value="{{ cobranca.data_repasse|date:'Y-m-d' }}"
            class="mt-1 block w-full p-2 border border-gray-300 rounded-md"
        />
    </div>

    <!-- Botão de Envio -->
    <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
    >
        Salvar
    </button>
</form>
