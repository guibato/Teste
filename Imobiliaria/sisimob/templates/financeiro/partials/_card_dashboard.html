{% load humanize %}
<div class="col-md-3">
    <div class="card shadow-sm card-dashboard bg-light">
        <div class="card-body">
            <h5 class="card-title text-{{ color }}">
                <i class="{{ icon }}"></i> {{ titulo }}
            </h5>
            <h3 class="card-text">R$ {{ valor|default:"0"|floatformat:2|intcomma }}</h3>
            <p class="text-muted mb-0">{{ descricao }}</p>
        </div>
    </div>
</div>
