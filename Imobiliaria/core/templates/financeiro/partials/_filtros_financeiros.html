<div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white d-flex align-items-center">
        <h5 class="mb-0">
            <i class="fas fa-filter me-2"></i> Filtros
        </h5>
        <button class="btn btn-sm btn-link" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFiltros">
            <i class="fas fa-chevron-down"></i>
        </button>
    </div>
    <div class="collapse show" id="collapseFiltros">
        <div class="card-body">
            <form method="get" action="{% url 'painel_financeiro' %}" class="row g-3">
                <div class="col-md-3 text-black">
                    <label for="{{ filtro_form.status.id_for_label }}" class="form-label text-white">Status Pagamento</label>
                    {{ filtro_form.status }}
                </div>
                <div class="col-md-3 text-black">
                    <label for="{{ filtro_form.status_repasse.id_for_label }}" class="form-label text-white">Status Repasse</label>
                    {{ filtro_form.status_repasse }}
                </div>
                <div class="col-md-3 text-black">
                    <label for="{{ filtro_form.data_inicio.id_for_label }}" class="form-label text-white">Data Início</label>
                    {{ filtro_form.data_inicio }}
                </div>
                <div class="col-md-3 text-black">
                    <label for="{{ filtro_form.data_fim.id_for_label }}" class="form-label text-white">Data Fim</label>
                    {{ filtro_form.data_fim }}
                </div>
                <div class="col-md-4 text-black">
                    <label for="{{ filtro_form.proprietario.id_for_label }}" class="form-label text-white">Proprietário</label>
                    {{ filtro_form.proprietario }}
                </div>
                <div class="col-md-4 text-black">
                    <label for="{{ filtro_form.inquilino.id_for_label }}" class="form-label text-white">Inquilino</label>
                    {{ filtro_form.inquilino }}
                </div>
                <div class="col-md-4 text-black">
                    <label for="{{ filtro_form.contrato.id_for_label }}" class="form-label text-white">Contrato / Imóvel</label>
                    {{ filtro_form.contrato }}
                </div>
                <div class="col-12 d-flex justify-content-start gap-2 pt-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search me-2"></i> Filtrar
                    </button>
                    <a href="{% url 'painel_financeiro' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-undo me-2"></i> Limpar Filtros
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
